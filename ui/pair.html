<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#01050b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<title>Pair with JARVIS</title>
<style>
  :root { --c: #2fd8ff; --ink: #cdefff; --dim: rgba(160, 220, 255, .6); --bg: #01050b; --bad: #ff5a6a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Rajdhani", system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; min-height: 100dvh; padding: 24px 16px;
    background: radial-gradient(ellipse at 50% 30%, rgba(47, 216, 255, .12), transparent 60%), var(--bg); }
  main { width: 100%; max-width: 380px; text-align: center; }
  .ring { width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 50%; border: 3px solid var(--c);
    box-shadow: 0 0 24px rgba(47, 216, 255, .55), inset 0 0 22px rgba(47, 216, 255, .4); display: grid; place-items: center; }
  .ring i { width: 34px; height: 34px; border-radius: 50%; background: #dffaff; box-shadow: 0 0 26px #8eeaff; }
  h1 { font-family: "Orbitron", system-ui, sans-serif; letter-spacing: .32em; font-size: 22px; margin: 0 0 6px; font-weight: 700; }
  p { color: var(--dim); line-height: 1.45; margin: 0 0 22px; font-size: 15px; }
  label { display: block; text-align: left; font-size: 12px; letter-spacing: .18em; color: var(--dim); margin: 14px 0 6px; }
  input { width: 100%; padding: 14px 12px; font: inherit; font-size: 17px; color: #fff; background: rgba(4, 22, 38, .7);
    border: 1px solid rgba(47, 216, 255, .35); border-radius: 6px; outline: none; }
  input:focus { border-color: var(--c); box-shadow: 0 0 0 3px rgba(47, 216, 255, .18); }
  #code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 30px; letter-spacing: .45em;
    text-align: center; padding-left: .45em; }
  button { width: 100%; margin-top: 20px; padding: 15px; font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .3em;
    color: #001018; background: var(--c); border: 0; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .5; }
  #msg { min-height: 1.4em; margin-top: 14px; font-size: 15px; }
  #msg.bad { color: var(--bad); }
  small { display: block; margin-top: 26px; color: var(--dim); font-size: 13px; line-height: 1.45; }
</style>
</head>
<body>
<main>
  <div class="ring"><i></i></div>
  <h1>J.A.R.V.I.S.</h1>
  <p>Pair this device with JARVIS on your computer. On that computer, open JARVIS, tap <b>📱 DEVICES</b> and choose <b>PAIR A DEVICE</b>.</p>
  <form id="f">
    <label for="code">PAIRING CODE</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="······">
    <label for="name">THIS DEVICE</label>
    <input id="name" maxlength="40" required>
    <button id="go">PAIR</button>
    <div id="msg" role="status"></div>
  </form>
  <small>Your computer runs JARVIS; this device becomes a full interface for it, with its own microphone and speaker.
    Both need to be on the same Wi-Fi.</small>
</main>
<script>
  const ua = navigator.userAgent;
  const guess = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? "iPad"
    : /iPhone/.test(ua) ? "iPhone" : /Android/.test(ua) ? (/Mobile/.test(ua) ? "Android phone" : "Android tablet")
    : /Windows/.test(ua) ? "Windows PC" : /Macintosh/.test(ua) ? (navigator.maxTouchPoints > 1 ? "iPad" : "Mac") : "Device";
  const $ = id => document.getElementById(id);
  $("name").value = guess;
  const fromLink = (location.hash.match(/code=(\d{6})/) || [])[1];  // from the QR code
  if (fromLink) { $("code").value = fromLink; history.replaceState(null, "", "/pair"); }
  async function pair(e) {
    e?.preventDefault();
    $("go").disabled = true; $("msg").className = ""; $("msg").textContent = "Pairing…";
    try {
      const r = await fetch("/pair", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: $("code").value, name: $("name").value }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "Pairing failed.");
      $("msg").textContent = "Paired. Opening JARVIS…";
      location.replace("/");
    } catch (err) {
      $("msg").className = "bad"; $("msg").textContent = err.message; $("go").disabled = false;
    }
  }
  $("f").addEventListener("submit", pair);
  if (fromLink) pair();
</script>
</body>
</html>
