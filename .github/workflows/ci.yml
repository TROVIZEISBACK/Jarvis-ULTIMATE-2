name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # PortAudio only powers the microphone, which the smoke test leaves off. JARVIS must start
      # without it, so a package-server outage is a warning here, not a failed build.
      - name: System audio library (Linux)
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -q && sudo apt-get install -y -q libportaudio2; then exit 0; fi
            echo "apt attempt $attempt failed; retrying in 15 s"; sleep 15
          done
          echo "::warning::Could not install libportaudio2; running the smoke test without it"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Smoke test (imports, start, HUD, origin check, hello)
        run: python tests/smoke.py

  web:
    name: Web interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: for f in ui/js/*.js ui/sw.js; do node --check "$f"; done
      - name: Manifest is valid JSON
        run: python3 -c "import json; json.load(open('ui/manifest.webmanifest'))"
